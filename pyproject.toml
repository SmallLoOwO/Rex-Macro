[project]
name = "rex-miningbot"
version = "0.1.0"
description = "Windows-only automation bot for Roblox REX"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.110",
    "imageio-ffmpeg==0.5.1",
    "mss==9.0.1",
    "numpy==2.1.2",
    "onnxruntime==1.27.0",
    "opencv-python==4.10.0.84",
    "pyaudiowpatch==0.2.12.7",
    "pydirectinput==1.0.4",
    "python-dotenv==1.2.2",
    "pytesseract==0.3.13",
    "rapidocr==3.9.1",
    "scipy==1.14.1",
    "uvicorn>=0.27",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "py-spy>=0.4.2,<0.5",
    "pytest==9.0.3",
    "ruff>=0.12,<1",
]
ocr-native = [
    "tesserocr @ https://github.com/simonflueckiger/tesserocr-windows_build/releases/download/tesserocr-v2.10.0-tesseract-5.5.2/tesserocr-2.10.0-cp311-cp311-win_amd64.whl ; sys_platform == 'win32' and python_version == '3.11'",
]

[tool.uv]
package = false
required-version = "==0.11.15"
default-groups = ["dev", "ocr-native"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "fixture: uses tracked real image or OCR fixtures",
    "ocr: requires or exercises a real OCR engine",
    "windows: exercises Windows-specific behavior",
]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["miningbot/game_data.py"]

[tool.ruff.lint]
# Start with correctness rules only. Formatting and broad style cleanup are a
# separate reviewable change because main.py contains calibrated provenance.
select = ["E9", "F63", "F7", "F82"]
